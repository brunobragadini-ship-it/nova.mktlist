<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nova.MKTLIST - Lista de Compras Inteligente</title>
    <style>
        :root {
            --primary-color: #6a5acd;
            --bg-color: #000000;
            --text-color: #ffffff;
            --secondary-text-color: #b0b0b0;
            --border-color: #333;
            --danger-color: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(0,0,0,0.8);
        }

        .logo-title-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .app-logo {
            height: 85px; /* Aumentado para dar destaque e legibilidade ideal */
            width: auto;
            object-fit: contain;
        }

        .header-title {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-color);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .sync-status {
            font-size: 1.2rem;
            color: var(--secondary-text-color);
        }

        .top-total-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #111;
            border-bottom: 1px solid var(--border-color);
            font-size: 1rem;
            font-weight: bold;
        }

        .total-value {
            color: #4cd137;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .item-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .list-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            background: #111;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .item-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .item-name {
            font-size: 1.05rem;
            flex: 1;
            font-weight: 500;
        }

        .item-row-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--secondary-text-color);
        }

        .item-check {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
        }

        .list-item.checked {
            opacity: 0.5;
        }

        .list-item.checked .item-name {
            text-decoration: line-through;
        }

        .list-item.checked .item-check {
            background-color: var(--primary-color);
        }

        .list-item.checked .item-check::after {
            content: '✓';
            color: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
        }

        .btn-action {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .btn-delete { color: var(--danger-color); }
        .btn-edit { color: #4da6ff; }

        .fab-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 99;
            transition: transform 0.2s;
        }

        .fab-btn:active {
            transform: scale(0.95);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #181818;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 350px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-content h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--secondary-text-color);
            font-weight: 500;
        }

        .input-field {
            background-color: #222;
            border: 1px solid #444;
            color: var(--text-color);
            padding: 10px;
            border-radius: 5px;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cancel { background: #333; color: white; }
        .btn-save { background: var(--primary-color); color: white; }
    </style>
</head>
<body>

    <header>
        <div class="logo-title-container">
            <img src="MKTLIST-removebg-preview.png" alt="Logo" class="app-logo">
            <span class="header-title">LISTA DE COMPRAS</span>
        </div>
        <div class="sync-status" id="syncStatus">🟢</div>
    </header>

    <div class="top-total-bar">
        <span>Total da Compra:</span>
        <span class="total-value" id="totalCompra">R$ 0,00</span>
    </div>

    <main>
        <ul class="item-list" id="itemList"></ul>
    </main>

    <button class="fab-btn" id="openAddModalBtn">+</button>

    <!-- Modal de Adicionar Item -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <h3>Adicionar Novo Item</h3>
            <div class="input-group">
                <label>Nome do Item</label>
                <input type="text" class="input-field" id="newModalName" placeholder="Ex: Arroz">
            </div>
            <div class="input-group">
                <label>Quantidade</label>
                <input type="number" step="any" class="input-field" id="newModalQty" placeholder="1">
            </div>
            <div class="input-group">
                <label>Valor Unitário (R$)</label>
                <input type="number" step="any" class="input-field" id="newModalPrice" placeholder="0.00">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" id="cancelAdd">Cancelar</button>
                <button class="modal-btn btn-save" id="saveAdd">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Edição de Item -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <h3>Editar Item</h3>
            <input type="hidden" id="editId">
            <div class="input-group">
                <label>Nome do Item</label>
                <input type="text" class="input-field" id="editName">
            </div>
            <div class="input-group">
                <label>Quantidade</label>
                <input type="number" step="any" class="input-field" id="editQty">
            </div>
            <div class="input-group">
                <label>Valor Unitário (R$)</label>
                <input type="number" step="any" class="input-field" id="editPrice">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" id="cancelEdit">Cancelar</button>
                <button class="modal-btn btn-save" id="saveEdit">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlBENTlIdu3z82s7LUP_bXe4vWgzLQq_k2ztwYIX366WL4XDs-WU6rSgN5KoTAOYyI/exec";

        const itemList = document.getElementById('itemList');
        const syncStatus = document.getElementById('syncStatus');
        const totalCompraEl = document.getElementById('totalCompra');

        const addModal = document.getElementById('addModal');
        const openAddModalBtn = document.getElementById('openAddModalBtn');
        const cancelAddBtn = document.getElementById('cancelAdd');
        const saveAddBtn = document.getElementById('saveAdd');
        const newModalName = document.getElementById('newModalName');
        const newModalQty = document.getElementById('newModalQty');
        const newModalPrice = document.getElementById('newModalPrice');

        const editModal = document.getElementById('editModal');
        const editIdInput = document.getElementById('editId');
        const editNameInput = document.getElementById('editName');
        const editQtyInput = document.getElementById('editQty');
        const editPriceInput = document.getElementById('editPrice');
        const cancelEditBtn = document.getElementById('cancelEdit');
        const saveEditBtn = document.getElementById('saveEdit');

        let listaCache = [];

        async function carregarLista() {
            try {
                const response = await fetch(`${WEB_APP_URL}?action=read&t=${Date.now()}`);
                const data = await response.json();
                if (Array.isArray(data)) {
                    listaCache = data;
                    renderizarLista(listaCache);
                    syncStatus.textContent = "🟢";
                }
            } catch (error) {
                syncStatus.textContent = "🔴";
            }
        }

        function renderizarLista(items) {
            itemList.innerHTML = '';
            let valorTotalGeral = 0;

            items.forEach(item => {
                const isChecked = item.checked === true || item.checked === "TRUE" || item.checked === "true";
                const qty = parseFloat(item.qty) || 0;
                const price = parseFloat(item.price) || 0;
                const subtotal = qty * price;

                if (!isChecked) {
                    valorTotalGeral += subtotal;
                }

                const li = document.createElement('li');
                li.className = `list-item ${isChecked ? 'checked' : ''}`;
                li.innerHTML = `
                    <div class="item-row-top">
                        <input type="checkbox" class="item-check" ${isChecked ? 'checked' : ''}>
                        <span class="item-name">${item.name}</span>
                        <div class="item-actions">
                            <button class="btn-action btn-edit">Editar</button>
                            <button class="btn-action btn-delete">Excluir</button>
                        </div>
                    </div>
                    <div class="item-row-bottom">
                        <span>Qtd: <strong>${qty}</strong> | Vlr Unit: <strong>R$ ${price.toFixed(2)}</strong></span>
                        <span>Subtotal: <strong>R$ ${subtotal.toFixed(2)}</strong></span>
                    </div>
                `;

                const checkbox = li.querySelector('.item-check');
                checkbox.addEventListener('change', () => {
                    item.checked = checkbox.checked;
                    renderizarLista(listaCache);
                    enviarRequisicao({ action: "update", id: item.id, name: item.name, qty: item.qty, price: item.price, checked: checkbox.checked });
                });

                li.querySelector('.btn-delete').addEventListener('click', () => {
                    listaCache = listaCache.filter(i => String(i.id) !== String(item.id));
                    renderizarLista(listaCache);
                    enviarRequisicao({ action: "delete", id: item.id });
                });

                li.querySelector('.btn-edit').addEventListener('click', () => {
                    editIdInput.value = item.id;
                    editNameInput.value = item.name;
                    editQtyInput.value = qty;
                    editPriceInput.value = price;
                    editModal.style.display = 'flex';
                });

                itemList.appendChild(li);
            });

            totalCompraEl.textContent = `R$ ${valorTotalGeral.toFixed(2)}`;
        }

        openAddModalBtn.addEventListener('click', () => {
            newModalName.value = '';
            newModalQty.value = '';
            newModalPrice.value = '';
            addModal.style.display = 'flex';
            newModalName.focus();
        });

        cancelAddBtn.addEventListener('click', () => {
            addModal.style.display = 'none';
        });

        saveAddBtn.addEventListener('click', () => {
            const name = newModalName.value.trim();
            const qty = parseFloat(newModalQty.value) || 1;
            const price = parseFloat(newModalPrice.value) || 0;

            if (name === '') return;

            const newItem = {
                id: Date.now(),
                name: name,
                qty: qty,
                price: price,
                checked: false
            };

            listaCache.push(newItem);
            renderizarLista(listaCache);
            addModal.style.display = 'none';

            enviarRequisicao({ action: "add", ...newItem });
        });

        cancelEditBtn.addEventListener('click', () => {
            editModal.style.display = 'none';
        });

        saveEditBtn.addEventListener('click', () => {
            const id = editIdInput.value;
            const name = editNameInput.value.trim();
            const qty = parseFloat(editQtyInput.value) || 1;
            const price = parseFloat(editPriceInput.value) || 0;

            if (name === '') return;

            const item = listaCache.find(i => String(i.id) === String(id));
            if (item) {
                item.name = name;
                item.qty = qty;
                item.price = price;
                renderizarLista(listaCache);
            }

            editModal.style.display = 'none';
            enviarRequisicao({ action: "update", id, name, qty, price, checked: item ? item.checked : false });
        });

        function enviarRequisicao(payload) {
            syncStatus.textContent = "🔄";
            const formData = new URLSearchParams();
            for (const key in payload) {
                formData.append(key, payload[key]);
            }

            fetch(WEB_APP_URL, {
                method: 'POST',
                    mode: 'no-cors',
                body: formData
            }).then(() => {
                syncStatus.textContent = "🟢";
            }).catch(() => {
                syncStatus.textContent = "🔴";
            });
        }

        carregarLista();
        setInterval(carregarLista, 10000);
    </script>
</body>
</html>
