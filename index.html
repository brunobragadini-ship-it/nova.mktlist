<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova.Mklist</title>
    
    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-color: #6a5acd;
            --primary-hover: #5848b5;
            --bg-color: #050505;
            --card-bg: #111113;
            --card-border: #222226;
            --text-color: #f3f4f6;
            --secondary-text-color: #9ca3af;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overscroll-behavior-y: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--card-border);
            background-color: rgba(11, 11, 13, 0.9);
            backdrop-filter: blur(10px);
        }

        .logo-title-container {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            flex: 1;
        }

        .app-logo {
            height: 38px;
            width: auto;
            object-fit: contain;
            flex-shrink: 0;
            border-radius: 6px;
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sync-status {
            font-size: 0.85rem;
            padding: 4px 10px;
            background: rgba(106, 90, 205, 0.15);
            border-radius: 20px;
            border: 1px solid rgba(106, 90, 205, 0.3);
            transition: all 0.3s ease;
        }

        .sync-status.offline {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .top-total-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .total-value {
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: 700;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .item-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 14px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            border-radius: 12px;
            transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        .list-item:hover {
            border-color: rgba(106, 90, 205, 0.4);
        }

        .list-item.dragging {
            opacity: 0.4;
            border: 2px dashed var(--primary-color);
        }

        .drag-handle {
            cursor: grab;
            color: var(--secondary-text-color);
            font-size: 1.2rem;
            padding: 0 6px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            touch-action: none;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .item-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .item-name {
            font-size: 1rem;
            flex: 1;
            min-width: 0;
            font-weight: 600;
            overflow-wrap: break-word;
            word-break: normal;
            hyphens: auto;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .item-row-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--secondary-text-color);
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .item-check {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--primary-color);
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            background: rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        .list-item.checked {
            opacity: 0.5;
            background: #0d0d0f;
        }

        .list-item.checked .item-name {
            text-decoration: line-through;
            color: var(--secondary-text-color);
        }

        .list-item.checked .item-check {
            background-color: var(--primary-color);
        }

        .list-item.checked .item-check::after {
            content: '✓';
            color: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            font-weight: bold;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 5px 8px;
            border-radius: 6px;
            color: var(--text-color);
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-delete { color: var(--danger-color); border-color: rgba(239, 68, 68, 0.2); }
        .btn-delete:hover { background: rgba(239, 68, 68, 0.1); }
        .btn-edit { color: #60a5fa; border-color: rgba(96, 165, 250, 0.2); }
        .btn-edit:hover { background: rgba(96, 165, 250, 0.1); }

        .fab-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(106, 90, 205, 0.5);
            transition: transform 0.2s, background-color 0.2s;
            z-index: 99;
        }

        .fab-btn:hover { background-color: var(--primary-hover); }
        .fab-btn:active { transform: scale(0.92); }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #161619;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .modal-content h3 {
            margin: 0 0 4px 0;
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--secondary-text-color);
            font-weight: 600;
        }

        .input-field {
            background-color: #0b0b0d;
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary-color);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 8px;
        }

        .modal-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .modal-btn:hover { opacity: 0.9; }
        .btn-cancel { background: #222226; color: var(--text-color); }
        .btn-save { background: var(--primary-color); color: white; }
    </style>
</head>
<body>

    <header>
        <div class="logo-title-container">
            <img src="MKTLIST-removebg-preview.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
            <span class="header-title">Lista de Compras</span>
        </div>
        <div class="sync-status" id="syncStatus">⚡ Sincronizado</div>
    </header>

    <div class="top-total-bar">
        <span>Total da Compra:</span>
        <span class="total-value" id="totalCompra">R$ 0,00</span>
    </div>

    <main id="mainContainer">
        <div id="loadingMsg" style="text-align: center; color: var(--secondary-text-color); margin-top: 40px;">Carregando itens...</div>
        <ul class="item-list" id="itemList"></ul>
    </main>

    <button class="fab-btn" id="openAddModalBtn">+</button>

    <!-- Modal de Adicionar Item -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <h3>Adicionar Novo Item</h3>
            <div class="input-group">
                <label>Nome do Item</label>
                <input type="text" class="input-field" id="newModalName" placeholder="Ex: Arroz">
            </div>
            <div class="input-group">
                <label>Quantidade</label>
                <input type="number" step="any" class="input-field" id="newModalQty" placeholder="1">
            </div>
            <div class="input-group">
                <label>Valor Unitário (R$)</label>
                <input type="number" step="any" class="input-field" id="newModalPrice" placeholder="0.00">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" id="cancelAdd">Cancelar</button>
                <button class="modal-btn btn-save" id="saveAdd">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Edição de Item -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <h3>Editar Item</h3>
            <input type="hidden" id="editId">
            <div class="input-group">
                <label>Nome do Item</label>
                <input type="text" class="input-field" id="editName">
            </div>
            <div class="input-group">
                <label>Quantidade</label>
                <input type="number" step="any" class="input-field" id="editQty">
            </div>
            <div class="input-group">
                <label>Valor Unitário (R$)</label>
                <input type="number" step="any" class="input-field" id="editPrice">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" id="cancelEdit">Cancelar</button>
                <button class="modal-btn btn-save" id="saveEdit">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zcyofjnswaozqlfvvhzw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sTZuxGBm5sf_mAEopreaUA_hbllL-l1';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const itemList = document.getElementById('itemList');
        const syncStatus = document.getElementById('syncStatus');
        const totalCompraEl = document.getElementById('totalCompra');
        const loadingMsg = document.getElementById('loadingMsg');

        const addModal = document.getElementById('addModal');
        const openAddModalBtn = document.getElementById('openAddModalBtn');
        const cancelAddBtn = document.getElementById('cancelAdd');
        const saveAddBtn = document.getElementById('saveAdd');
        const newModalName = document.getElementById('newModalName');
        const newModalQty = document.getElementById('newModalQty');
        const newModalPrice = document.getElementById('newModalPrice');

        const editModal = document.getElementById('editModal');
        const editIdInput = document.getElementById('editId');
        const editNameInput = document.getElementById('editName');
        const editQtyInput = document.getElementById('editQty');
        const editPriceInput = document.getElementById('editPrice');
        const cancelEditBtn = document.getElementById('cancelEdit');
        const saveEditBtn = document.getElementById('saveEdit');

        let listaCache = JSON.parse(localStorage.getItem('mklist_cache')) || [];
        let syncQueue = JSON.parse(localStorage.getItem('mklist_queue')) || [];
        let draggedElement = null;

        function salvarCacheLocal() {
            localStorage.setItem('mklist_cache', JSON.stringify(listaCache));
        }

        function salvarFilaLocal() {
            localStorage.setItem('mklist_queue', JSON.stringify(syncQueue));
        }

        function atualizarStatus(texto, modo = 'normal') {
            syncStatus.textContent = texto;
            if (modo === 'offline') {
                syncStatus.classList.add('offline');
            } else {
                syncStatus.classList.remove('offline');
            }
        }

        async function carregarLista() {
            // Desenhar imediatamente o cache local se existir
            if (listaCache.length > 0) {
                loadingMsg.style.display = 'none';
                renderizarLista(listaCache);
            }

            if (!navigator.onLine) {
                atualizarStatus("📡 Modo Offline", "offline");
                loadingMsg.style.display = 'none';
                return;
            }

            atualizarStatus("🔄 Sincronizando...");
            
            try {
                // Tenta processar fila de pendências antes de buscar
                await processarFilaPendente();

                const { data, error } = await _supabase.from('lista').select('*').order('created_at', { ascending: false });
                loadingMsg.style.display = 'none';

                if (!error && data) {
                    listaCache = data;
                    salvarCacheLocal();
                    renderizarLista(listaCache);
                    atualizarStatus("⚡ Sincronizado");
                } else {
                    atualizarStatus("📡 Modo Offline (Erro)", "offline");
                }
            } catch (err) {
                loadingMsg.style.display = 'none';
                atualizarStatus("📡 Modo Offline", "offline");
            }
        }

        async function processarFilaPendente() {
            if (!navigator.onLine || syncQueue.length === 0) return;

            atualizarStatus("🔄 Sincronizando alterações...");

            const filaAtual = [...syncQueue];
            for (let i = 0; i < filaAtual.length; i++) {
                const acao = filaAtual[i];
                try {
                    if (acao.type === 'INSERT') {
                        const { data } = await _supabase.from('lista').insert([acao.payload]).select();
                        if (data && data[0]) {
                            // Substituir ID temporário pelo ID real do servidor
                            const index = listaCache.findIndex(item => String(item.id) === String(acao.tempId));
                            if (index !== -1) {
                                listaCache[index].id = data[0].id;
                            }
                        }
                    } else if (acao.type === 'UPDATE') {
                        await _supabase.from('lista').update(acao.payload).eq('id', acao.id);
                    } else if (acao.type === 'DELETE') {
                        await _supabase.from('lista').delete().eq('id', acao.id);
                    }
                    // Remove da fila após sucesso
                    syncQueue.shift();
                    salvarFilaLocal();
                    salvarCacheLocal();
                } catch (e) {
                    break; // Se falhar em algum passo, interrompe
                }
            }
        }

        function renderizarLista(items) {
            itemList.innerHTML = '';
            let valorTotalGeral = 0;

            if (items.length === 0) {
                itemList.innerHTML = '<p style="text-align:center; color: var(--secondary-text-color); margin-top:20px;">Sua lista está vazia.</p>';
                totalCompraEl.textContent = "R$ 0,00";
                return;
            }

            const itensOrdenados = [...items].sort((a, b) => {
                return (a.checked === true ? 1 : 0) - (b.checked === true ? 1 : 0);
            });

            itensOrdenados.forEach((item) => {
                const isChecked = item.checked === true;
                const qty = parseFloat(item.qty) || 0;
                const price = parseFloat(item.price) || 0;
                const subtotal = qty * price;

                valorTotalGeral += subtotal;

                const li = document.createElement('li');
                li.className = `list-item ${isChecked ? 'checked' : ''}`;
                li.setAttribute('draggable', 'true');
                li.dataset.id = item.id;

                li.innerHTML = `
                    <div class="item-row-top">
                        <span class="drag-handle" title="Segure e arraste para mover">⋮⋮</span>
                        <input type="checkbox" class="item-check" ${isChecked ? 'checked' : ''}>
                        <span class="item-name">${item.name}</span>
                        <div class="item-actions">
                            <button class="btn-action btn-edit">Editar</button>
                            <button class="btn-action btn-delete">Excluir</button>
                        </div>
                    </div>
                    <div class="item-row-bottom">
                        <span>Qtd: <strong>${qty}</strong> | Vlr Unit: <strong>R$ ${price.toFixed(2)}</strong></span>
                        <span>Subtotal: <strong>R$ ${subtotal.toFixed(2)}</strong></span>
                    </div>
                `;

                // Drag & Drop
                li.addEventListener('dragstart', (e) => {
                    draggedElement = li;
                    li.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                li.addEventListener('dragend', () => {
                    draggedElement = null;
                    li.classList.remove('dragging');
                });

                const handle = li.querySelector('.drag-handle');
                handle.addEventListener('touchstart', () => {
                    draggedElement = li;
                    li.classList.add('dragging');
                }, { passive: true });

                handle.addEventListener('touchend', () => {
                    draggedElement = null;
                    li.classList.remove('dragging');
                });

                // Checkbox Event
                const checkbox = li.querySelector('.item-check');
                checkbox.addEventListener('change', async () => {
                    item.checked = checkbox.checked;
                    salvarCacheLocal();
                    renderizarLista(listaCache);

                    if (navigator.onLine) {
                        await _supabase.from('lista').update({ checked: checkbox.checked }).eq('id', item.id);
                    } else {
                        syncQueue.push({ type: 'UPDATE', id: item.id, payload: { checked: checkbox.checked } });
                        salvarFilaLocal();
                    }
                });

                // Delete Event
                li.querySelector('.btn-delete').addEventListener('click', async () => {
                    const itemToDeleteId = item.id;
                    listaCache = listaCache.filter(i => String(i.id) !== String(itemToDeleteId));
                    salvarCacheLocal();
                    renderizarLista(listaCache);

                    if (navigator.onLine) {
                        await _supabase.from('lista').delete().eq('id', itemToDeleteId);
                    } else {
                        syncQueue.push({ type: 'DELETE', id: itemToDeleteId });
                        salvarFilaLocal();
                    }
                });

                // Edit Event
                li.querySelector('.btn-edit').addEventListener('click', () => {
                    editIdInput.value = item.id;
                    editNameInput.value = item.name;
                    editQtyInput.value = qty;
                    editPriceInput.value = price;
                    editModal.style.display = 'flex';
                });

                itemList.appendChild(li);
            });

            totalCompraEl.textContent = `R$ ${valorTotalGeral.toFixed(2)}`;
        }

        // Suporte a ordenação no Drag & Drop
        itemList.addEventListener('dragover', (e) => {
            e.preventDefault();
            const afterElement = getDragAfterElement(itemList, e.clientY);
            if (draggedElement) {
                if (afterElement == null) {
                    itemList.appendChild(draggedElement);
                } else {
                    itemList.insertBefore(draggedElement, afterElement);
                }
            }
        });

        itemList.addEventListener('touchmove', (e) => {
            if (!draggedElement) return;
            const touchLocation = e.touches[0];
            const afterElement = getDragAfterElement(itemList, touchLocation.clientY);
            if (afterElement == null) {
                itemList.appendChild(draggedElement);
            } else {
                itemList.insertBefore(draggedElement, afterElement);
            }
        });

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.list-item:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // Ações de Adicionar
        openAddModalBtn.addEventListener('click', () => {
            newModalName.value = '';
            newModalQty.value = '';
            newModalPrice.value = '';
            addModal.style.display = 'flex';
            newModalName.focus();
        });

        cancelAddBtn.addEventListener('click', () => {
            addModal.style.display = 'none';
        });

        saveAddBtn.addEventListener('click', async () => {
            const name = newModalName.value.trim();
            const qty = parseFloat(newModalQty.value) || 1;
            const price = parseFloat(newModalPrice.value) || 0;

            if (name === '') return;

            addModal.style.display = 'none';

            const tempId = 'temp_' + Date.now();
            const novoItem = { id: tempId, name, qty, price, checked: false, created_at: new Date().toISOString() };

            listaCache.unshift(novoItem);
            salvarCacheLocal();
            renderizarLista(listaCache);

            if (navigator.onLine) {
                atualizarStatus("🔄 Salvando...");
                const { data, error } = await _supabase.from('lista').insert([{ name, qty, price, checked: false }]).select();
                if (!error && data && data[0]) {
                    novoItem.id = data[0].id;
                    salvarCacheLocal();
                    renderizarLista(listaCache);
                    atualizarStatus("⚡ Sincronizado");
                }
            } else {
                syncQueue.push({ type: 'INSERT', tempId, payload: { name, qty, price, checked: false } });
                salvarFilaLocal();
                atualizarStatus("📡 Modo Offline (Pendente)", "offline");
            }
        });

        // Ações de Editar
        cancelEditBtn.addEventListener('click', () => {
            editModal.style.display = 'none';
        });

        saveEditBtn.addEventListener('click', async () => {
            const id = editIdInput.value;
            const name = editNameInput.value.trim();
            const qty = parseFloat(editQtyInput.value) || 1;
            const price = parseFloat(editPriceInput.value) || 0;

            if (name === '') return;

            editModal.style.display = 'none';

            const itemIndex = listaCache.findIndex(i => String(i.id) === String(id));
            if (itemIndex !== -1) {
                listaCache[itemIndex] = { ...listaCache[itemIndex], name, qty, price };
                salvarCacheLocal();
                renderizarLista(listaCache);
            }

            if (navigator.onLine) {
                atualizarStatus("🔄 Atualizando...");
                await _supabase.from('lista').update({ name, qty, price }).eq('id', id);
                atualizarStatus("⚡ Sincronizado");
            } else {
                syncQueue.push({ type: 'UPDATE', id, payload: { name, qty, price } });
                salvarFilaLocal();
                atualizarStatus("📡 Modo Offline (Pendente)", "offline");
            }
        });

        // Listeners de estado de rede
        window.addEventListener('online', () => {
            atualizarStatus("⚡ Conectado! Sincronizando...");
            carregarLista();
        });

        window.addEventListener('offline', () => {
            atualizarStatus("📡 Modo Offline", "offline");
        });

        // Subscrição Supabase Realtime (Apenas online)
        _supabase
            .channel('public:lista')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'lista' }, () => {
                if (navigator.onLine && syncQueue.length === 0) {
                    carregarLista();
                }
            })
            .subscribe();

        // Inicialização
        carregarLista();
    </script>
</body>
</html>
