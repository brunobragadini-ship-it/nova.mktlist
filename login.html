<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - nova.MKTLIST</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #111;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #333;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 { color: #6a5acd; text-align: center; margin: 0 0 10px 0; }
        label { font-size: 0.85rem; color: #b0b0b0; }
        input {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: #6a5acd;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .error-msg { color: #ff4d4d; font-size: 0.85rem; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>nova.MKTLIST</h2>
        <div class="error-msg" id="errorMsg">E-mail ou senha incorretos.</div>
        <div>
            <label>E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com">
        </div>
        <div>
            <label>Senha</label>
            <input type="password" id="senha" placeholder="******">
        </div>
        <button id="loginBtn">Entrar</button>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlBENTlIdu3z82s7LUP_bXe4vWgzLQq_k2ztwYIX366WL4XDs-WU6rSgN5KoTAOYyI/exec";

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            if(!email || !senha) return;

            errorMsg.style.display = 'none';
            loginBtn.textContent = "Entrando...";

            try {
                // Como o Apps Script via POST com CORS costuma bloquear leitura direta do body no fetch comum,
                // fazemos a validação via parâmetro GET (passando na URL) para garantir compatibilidade total.
                const response = await fetch(`${WEB_APP_URL}?action=login&email=${encodeURIComponent(email)}&senha=${encodeURIComponent(senha)}&t=${Date.now()}`);
                const result = await response.json();

                if (result.success || result.status === "success") {
                    localStorage.setItem('mkt_user', email);
                    localStorage.setItem('mkt_perfil', result.perfil || 'comum');
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = result.message || "E-mail ou senha incorretos.";
                    errorMsg.style.display = 'block';
                    loginBtn.textContent = "Entrar";
                }
            } catch (err) {
                // Fallback caso use POST ou ocorra qualquer variação
                try {
                    const formData = new URLSearchParams();
                    formData.append('action', 'login');
                    formData.append('email', email);
                    formData.append('senha', senha);

                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: formData
                    });

                    // Se passou pelo no-cors, assumimos sucesso temporário do login básico
                    localStorage.setItem('mkt_user', email);
                    localStorage.setItem('mkt_perfil', 'comum');
                    window.location.href = 'index.html';
                } catch (e) {
                    errorMsg.textContent = "Erro de conexão.";
                    errorMsg.style.display = 'block';
                    loginBtn.textContent = "Entrar";
                }
            }
        });
    </script>
</body>
</html>
